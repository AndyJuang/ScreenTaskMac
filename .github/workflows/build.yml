name: Build and verify macOS
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Core regression tests
        run: swift run --disable-sandbox ScreenTaskCoreTests
      - name: Build arm64 app
        run: bash scripts/build-app.sh
      - name: HTTP integration tests
        run: python3 scripts/smoke-test.py
      - name: Viewer browser tests
        run: |
          python3 -m pip install --quiet --break-system-packages playwright
          python3 -m playwright install chromium webkit
          SCREENTASK_VIEWER_ENGINES=chromium,webkit python3 scripts/viewer-test.py
      - uses: actions/upload-artifact@v7
        with:
          name: ScreenTaskMac-arm64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
