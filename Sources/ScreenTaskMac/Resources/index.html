<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ScreenTask Mac · 螢幕分享</title>
<style>
:root{color-scheme:dark;font:16px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#101819;color:#edf7f5}*{box-sizing:border-box}body{margin:0}header,footer{max-width:1440px;margin:auto;padding:22px 28px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:22px;margin:0 0 5px}p{margin:0;color:#adc2bf;font-size:14px}main{padding:0 20px}#stage{min-height:50vh;background:#080d0e;border:1px solid #2c4140;border-radius:14px;display:flex;align-items:center;justify-content:center;overflow:auto;position:relative}#screen{display:block;max-width:100%;max-height:77vh;object-fit:contain}#screen[hidden]{display:none}#screen.actual{max-width:none;max-height:none}#stage:fullscreen,#stage.expanded{background:#000;width:100vw;height:100vh;border:0;border-radius:0}#stage:fullscreen #screen,#stage.expanded #screen{max-height:100vh}#stage.expanded{position:fixed;inset:0;z-index:10}#exit{display:none;position:absolute;right:16px;top:16px;z-index:11}#stage:fullscreen #exit,#stage.expanded #exit{display:block}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;padding:18px 0;max-width:1440px;margin:auto}button,input{font:inherit;color:inherit;background:#233634;border:1px solid #476561;border-radius:8px;padding:10px 14px}button{cursor:pointer}button:hover{background:#35534e}button:focus-visible,input:focus-visible{outline:3px solid #70e1ca;outline-offset:2px}#toggle{background:#8be4ca;color:#0e3028;border:0}input{width:100px}a{color:#8be4ca}#status{font-size:14px;color:#8be4ca}#message{padding:40px;color:#adc2bf;text-align:center}footer{font-size:12px;color:#a1b8b2;border-top:1px solid #2c4140}details{margin:12px 0} @media(max-width:600px){header{padding:18px}main{padding:0 10px}.controls{gap:8px}button,input{padding:9px}#stage{min-height:35vh}}
</style></head><body>
<header><div><h1>ScreenTask Mac</h1><p>區域網路螢幕分享 · 無須安裝觀看軟體</p></div><span id="status" role="status" aria-live="polite">正在連線…</span></header>
<main><div id="stage"><img id="screen" alt="分享中的 Mac 螢幕" hidden><div id="message">等待分享畫面…</div><button id="exit" aria-label="離開全螢幕">離開全螢幕</button></div>
<div class="controls"><button id="toggle">暫停觀看</button><button id="fullscreen">全螢幕</button><button id="fit">原始大小</button><label for="interval">更新間隔（毫秒）</label><input id="interval" type="number" min="50" max="10000" step="50" value="150"><button id="apply">套用</button></div></main>
<footer>ScreenTask Mac · GPL-3.0-or-later · Inspired by <a href="https://github.com/EslaMx7/ScreenTask" target="_blank" rel="noopener noreferrer">ScreenTask</a>
<details><summary>關於與連線說明</summary><p>同一個區域網路即可觀看。暫停僅影響這個瀏覽器；分享者停止後將自動重試。HTTP 傳輸未加密，請使用可信任的網路。部分手機瀏覽器以滿版模式代替全螢幕。</p></details></footer>
<script>
'use strict';
const screenImage=document.getElementById('screen'),statusLabel=document.getElementById('status'),message=document.getElementById('message'),stage=document.getElementById('stage');
let watching=true,interval=150,timer=null,controller=null,objectURL=null,generation=0;
function schedule(ms){clearTimeout(timer);if(watching&&!document.hidden)timer=setTimeout(load,ms)}
async function load(){
 if(!watching||document.hidden)return;
 const current=++generation;controller=new AbortController();const timeout=setTimeout(()=>controller?.abort(),8000);
 try{
  const response=await fetch('/ScreenTask.jpg?t='+Date.now(),{cache:'no-store',signal:controller.signal});
  if(!response.ok)throw new Error(response.status===401?'帳密驗證失敗，請重新整理登入':'分享已停止或正在等待畫面');
  const blob=await response.blob();if(current!==generation||!watching)return;
  const next=URL.createObjectURL(blob);const old=objectURL;objectURL=next;screenImage.src=next;
  if(old)URL.revokeObjectURL(old);
  screenImage.hidden=false;message.hidden=true;statusLabel.textContent='● 正在觀看';schedule(interval);
 }catch(error){if(current!==generation||!watching)return;screenImage.hidden=true;message.hidden=false;message.textContent=error.name==='AbortError'?'連線逾時，正在重試…':error instanceof TypeError?'分享已停止或網路中斷，正在重試…':error.message;statusLabel.textContent='等待重新連線';schedule(2000)}
 finally{clearTimeout(timeout);if(current===generation)controller=null}
}
function cancel(){generation++;clearTimeout(timer);controller?.abort();controller=null}
document.getElementById('toggle').onclick=event=>{watching=!watching;cancel();event.currentTarget.textContent=watching?'暫停觀看':'繼續觀看';statusLabel.textContent=watching?'正在連線…':'已暫停';if(watching)load()};
document.getElementById('apply').onclick=()=>{const input=document.getElementById('interval');const value=Number(input.value);if(!Number.isFinite(value)||value<50||value>10000){input.setCustomValidity('請輸入 50 到 10000 毫秒');input.reportValidity();return}input.setCustomValidity('');interval=Math.round(value)};
document.getElementById('interval').oninput=event=>event.target.setCustomValidity('');
document.getElementById('fit').onclick=event=>{screenImage.classList.toggle('actual');event.currentTarget.textContent=screenImage.classList.contains('actual')?'符合視窗':'原始大小'};
document.getElementById('fullscreen').onclick=async()=>{try{if(stage.requestFullscreen)await stage.requestFullscreen();else stage.classList.add('expanded')}catch{stage.classList.add('expanded')}};
function exit(){stage.classList.remove('expanded');if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})}
document.getElementById('exit').onclick=exit;document.addEventListener('keydown',event=>{if(event.key==='Escape')exit()});
document.addEventListener('visibilitychange',()=>{cancel();if(!document.hidden&&watching)load()});
window.addEventListener('pagehide',()=>{cancel();if(objectURL)URL.revokeObjectURL(objectURL)});load();
</script></body></html>
